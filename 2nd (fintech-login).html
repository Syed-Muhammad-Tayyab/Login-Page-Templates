<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Vault & Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-green: #0F2E22;
    --ink-green-dim: #163B2B;
    --paper: #F2EFE4;
    --paper-line: #E4DEC9;
    --card: #F8F6EE;
    --line: #DCD5BE;
    --line-bright: #C7BE9F;
    --text: #1B1B16;
    --text-dim: #6B6558;
    --text-dimmer: #A39C87;
    --brass: #A9813F;
    --brass-deep: #8A6A31;
    --brass-soft: rgba(169,129,63,0.12);
    --brass-glow: rgba(169,129,63,0.35);

    --serif: 'Newsreader', serif;
    --mono: 'Space Mono', monospace;
    --body: 'Inter', sans-serif;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }

  body{
    background:var(--paper);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }

  /* ===== ticker bar ===== */
  .ticker-bar{
    background:var(--ink-green);
    overflow:hidden;
    white-space:nowrap;
    border-bottom:1px solid var(--brass-deep);
    padding:9px 0;
  }
  .ticker-track{
    display:inline-flex;
    animation:scroll 42s linear infinite;
  }
  .ticker-item{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.02em;
    color:#C9C2AC;
    padding:0 26px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    border-right:1px solid rgba(201,194,172,0.18);
  }
  .ticker-item .up{ color:#7FAE8C; }
  .ticker-item .down{ color:#C97361; }
  @keyframes scroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }

  /* ===== page layout ===== */
  .stage{
    min-height:calc(100vh - 38px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 20px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:400px;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 27px,
        var(--paper-line) 28px
      ),
      var(--card);
    border:1px solid var(--line);
    box-shadow: 0 1px 0 var(--line-bright);
    padding:42px 38px 34px;
  }

  .card-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:6px;
  }

  .brand{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .brand strong{ color:var(--text); font-weight:700; }

  .seal{
    width:38px;
    height:38px;
    flex-shrink:0;
  }

  h1{
    font-family:var(--serif);
    font-weight:500;
    font-size:29px;
    letter-spacing:-0.005em;
    margin:22px 0 8px;
  }

  .sub{
    font-size:13.5px;
    color:var(--text-dim);
    margin-bottom:36px;
    line-height:1.55;
  }
  .sub a{
    color:var(--text);
    text-decoration:none;
    border-bottom:1px solid var(--line-bright);
  }
  .sub a:hover{ color:var(--brass-deep); border-color:var(--brass); }

  .field{ margin-bottom:24px; position:relative; }

  .field label{
    display:flex;
    justify-content:space-between;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:9px;
    transition:color .2s ease;
  }
  .field label .hint{
    color:var(--text-dimmer);
    text-transform:none;
    letter-spacing:0;
    font-family:var(--body);
  }

  .input-row{ position:relative; }

  .field input{
    width:100%;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:14.5px;
    letter-spacing:0.02em;
    padding:12px 13px;
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .field input::placeholder{ color:var(--text-dimmer); font-family:var(--body); letter-spacing:0; }
  .field input:focus{
    border-color:var(--brass);
    box-shadow:0 0 0 3px var(--brass-soft);
  }
  .field:focus-within label{ color:var(--brass-deep); }

  .toggle-pw{
    position:absolute;
    right:11px; top:50%;
    transform:translateY(-50%);
    background:none; border:none;
    font-family:var(--body);
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-dimmer);
    cursor:pointer;
  }
  .toggle-pw:hover{ color:var(--text); }

  .row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:22px 0 28px;
    font-size:13px;
  }

  .remember{
    display:flex; align-items:center; gap:9px;
    color:var(--text-dim); cursor:pointer; user-select:none;
  }
  .checkbox{
    width:15px; height:15px;
    border:1px solid var(--line-bright);
    display:inline-flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition:background .15s ease, border-color .15s ease;
  }
  .checkbox.checked{ background:var(--brass); border-color:var(--brass); }
  .checkbox svg{ width:9px; height:9px; opacity:0; transition:opacity .1s ease; }
  .checkbox.checked svg{ opacity:1; }

  .forgot{
    color:var(--text-dim); text-decoration:none;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .forgot:hover{ color:var(--text); border-color:var(--line-bright); }

  .btn-primary{
    width:100%;
    background:var(--ink-green);
    color:var(--paper);
    border:none;
    font-family:var(--body);
    font-weight:600;
    font-size:14.5px;
    padding:14px 0;
    cursor:pointer;
    letter-spacing:0.01em;
    transition:background .2s ease, box-shadow .2s ease;
  }
  .btn-primary:hover{
    background:var(--ink-green-dim);
    box-shadow:0 0 0 3px var(--brass-soft);
  }

  .trust-row{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:28px;
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-dimmer);
  }
  .trust-row .dot{ color:var(--line-bright); }

  .footer-note{
    text-align:center;
    margin-top:28px;
    font-size:13px;
    color:var(--text-dim);
  }
  .footer-note a{
    color:var(--text);
    text-decoration:none;
    border-bottom:1px solid var(--line-bright);
  }
  .footer-note a:hover{ color:var(--brass-deep); border-color:var(--brass); }

  :focus-visible{ outline:1px solid var(--brass-deep); outline-offset:3px; }

  @media (max-width:480px){
    .card{ padding:34px 24px 28px; }
    h1{ font-size:25px; }
  }
</style>
</head>
<body>

<div class="ticker-bar">
  <div class="ticker-track" id="ticker-track"></div>
</div>

<div class="stage">
  <div class="card">
    <div class="card-head">
      <div class="brand"><strong>Vault &amp; Co.</strong><br>Private Access</div>
      <svg class="seal" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="18.5" fill="none" stroke="#A9813F" stroke-width="1"/>
        <circle cx="20" cy="20" r="15" fill="none" stroke="#A9813F" stroke-width="0.6"/>
        <text x="20" y="26" text-anchor="middle" font-family="Newsreader, serif" font-size="18" fill="#A9813F">V</text>
      </svg>
    </div>

    <h1>Welcome back.</h1>
    <p class="sub">Sign in to view your accounts. Not a client? <a href="#">Request access</a>.</p>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="client-id">Client ID</label>
        <div class="input-row">
          <input type="text" id="client-id" placeholder="VC-000000" required>
        </div>
      </div>

      <div class="field">
        <label for="passphrase">Passphrase <span class="hint">min. 12 characters</span></label>
        <div class="input-row">
          <input type="password" id="passphrase" placeholder="••••••••••••" required>
          <button type="button" class="toggle-pw" id="toggle-pw">Show</button>
        </div>
      </div>

      <div class="row-between">
        <label class="remember" id="remember-toggle">
          <span class="checkbox" id="checkbox-box">
            <svg viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="#F2EFE4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          Remember this device
        </label>
        <a href="#" class="forgot">Forgot passphrase</a>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">Enter your account</button>

      <div class="trust-row">
        <span>256-BIT ENCRYPTED</span><span class="dot">·</span><span>AUDITED ANNUALLY</span><span class="dot">·</span><span>SIPC INSURED</span>
      </div>
    </form>

    <p class="footer-note">Trouble signing in? <a href="#">Contact your advisor</a></p>
  </div>
</div>

<script>
  // ticker data — duplicated once for seamless marquee loop
  const items = [
    { label: 'S&P 500', val: '5,912.4', dir: 'up', chg: '+0.34%' },
    { label: '10Y YIELD', val: '4.12%', dir: 'down', chg: '-0.03' },
    { label: 'EUR/USD', val: '1.0842', dir: 'up', chg: '+0.06%' },
    { label: 'GOLD', val: '2,431.7', dir: 'up', chg: '+0.21%' },
    { label: 'BTC', val: '61,204', dir: 'down', chg: '-1.12%' },
    { label: 'DXY', val: '104.31', dir: 'up', chg: '+0.09%' },
    { label: 'WTI CRUDE', val: '78.42', dir: 'down', chg: '-0.44%' },
  ];

  function renderTicker(){
    const track = document.getElementById('ticker-track');
    const set = items.map(i => `
      <span class="ticker-item">
        ${i.label} <span>${i.val}</span>
        <span class="${i.dir === 'up' ? 'up' : 'down'}">${i.dir === 'up' ? '▲' : '▼'} ${i.chg}</span>
      </span>
    `).join('');
    track.innerHTML = set + set; // duplicate for seamless loop
  }
  renderTicker();

  // password visibility
  const pwInput = document.getElementById('passphrase');
  const pwToggle = document.getElementById('toggle-pw');
  pwToggle.addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    pwToggle.textContent = isPw ? 'Hide' : 'Show';
  });

  // remember checkbox
  const rememberToggle = document.getElementById('remember-toggle');
  const checkboxBox = document.getElementById('checkbox-box');
  rememberToggle.addEventListener('click', (e) => {
    e.preventDefault();
    checkboxBox.classList.toggle('checked');
  });

  // submit demo state
  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const original = btn.textContent;
    btn.textContent = 'Verifying…';
    btn.style.opacity = '0.75';
    setTimeout(() => {
      btn.textContent = original;
      btn.style.opacity = '1';
    }, 1400);
  });
</script>

</body>
</html>
