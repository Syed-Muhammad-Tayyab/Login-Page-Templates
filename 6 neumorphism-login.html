<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cairn — Unlock your vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1f26;
    --bg-hi:#262a33;
    --shadow-dark: rgba(0,0,0,0.58);
    --shadow-light: rgba(255,255,255,0.045);
    --brass:#caa049;
    --brass-soft: rgba(202,160,73,0.22);
    --text-0:#eae7e0;
    --text-1:#9a9ca3;
    --text-2:#65676f;
    --radius-card:30px;
    --radius-field:16px;
    --radius-btn:16px;
    --ease: cubic-bezier(.16,.8,.24,1);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(560px 380px at 50% 6%, rgba(202,160,73,0.05), transparent 70%),
      radial-gradient(120% 100% at 50% 15%, var(--bg-hi) 0%, var(--bg) 55%);
    font-family:'Manrope', sans-serif;
    color:var(--text-0);
    padding:24px;
  }

  /* ---------- Neumorphic primitives ---------- */
  .neu-out{
    background: var(--bg);
    box-shadow: 10px 10px 22px var(--shadow-dark), -10px -10px 22px var(--shadow-light);
  }
  .neu-in{
    background: var(--bg);
    box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
  }

  .card{
    width:100%;
    max-width:408px;
    border-radius:var(--radius-card);
    padding:40px 34px 30px;
    text-align:center;
  }

  /* ---------- Vault dial mark ---------- */
  .dial{
    position:relative;
    width:82px; height:82px;
    border-radius:50%;
    margin:0 auto 22px;
  }
  .dial::before{
    content:"";
    position:absolute; inset:7px;
    border-radius:50%;
    background: repeating-conic-gradient(var(--text-2) 0deg 1.1deg, transparent 1.1deg 30deg);
    opacity:0.55;
  }
  .dial::after{
    content:"";
    position:absolute; inset:17px;
    border-radius:50%;
    background: var(--bg);
    box-shadow: inset 4px 4px 9px var(--shadow-dark), inset -4px -4px 9px var(--shadow-light);
  }
  .dial .needle{
    position:absolute; left:50%; top:50%;
    width:2px; height:20px;
    background: var(--brass);
    border-radius:2px;
    transform-origin:bottom center;
    transform: translate(-50%,-100%) rotate(0deg);
    box-shadow: 0 0 7px rgba(202,160,73,0.65);
    animation: unlock 1.3s var(--ease) 0.25s both;
    z-index:2;
  }
  .dial .hub{
    position:absolute; left:50%; top:50%;
    width:6px; height:6px; border-radius:50%;
    background: var(--brass);
    transform:translate(-50%,-50%);
    box-shadow: 0 0 7px rgba(202,160,73,0.75);
    z-index:2;
  }
  @keyframes unlock{
    0%{ transform: translate(-50%,-100%) rotate(-72deg); }
    72%{ transform: translate(-50%,-100%) rotate(9deg); }
    100%{ transform: translate(-50%,-100%) rotate(0deg); }
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--text-2);
    margin:0 0 10px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:26px;
    letter-spacing:-0.01em;
    margin:0 0 8px;
  }
  .sub{
    font-size:13.5px;
    color:var(--text-1);
    line-height:1.55;
    margin:0 0 28px;
    max-width:30ch;
    margin-left:auto; margin-right:auto;
  }

  form{ display:flex; flex-direction:column; gap:16px; text-align:left; }

  .field{ position:relative; }
  .field label{
    display:block;
    font-size:11.5px;
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.06em;
    color:var(--text-2);
    text-transform:uppercase;
    margin:0 0 8px 4px;
  }
  .field input{
    width:100%;
    padding:15px 16px;
    border:none;
    border-radius:var(--radius-field);
    color:var(--text-0);
    font-family:'Manrope', sans-serif;
    font-size:14.5px;
    outline:none;
  }
  .field--pw input{ padding-right:46px; }
  .field input:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:2px;
  }
  .field input:focus{
    box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light), 0 0 0 3px var(--brass-soft);
  }

  .pw-toggle{
    position:absolute;
    right:10px; bottom:11px;
    width:30px; height:30px;
    border:none; border-radius:10px;
    background: var(--bg);
    box-shadow: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
    color:var(--text-1);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: box-shadow .15s var(--ease), color .2s var(--ease);
  }
  .pw-toggle:active{
    box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
  }
  .pw-toggle:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  .pw-toggle svg{ width:15px; height:15px; }

  .row-between{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:2px;
  }

  .switch{ display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; }
  .switch-track{
    position:relative;
    width:42px; height:24px;
    border-radius:999px;
    background: var(--bg);
    box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    transition: box-shadow .25s var(--ease);
    flex-shrink:0;
  }
  .switch-thumb{
    position:absolute; top:3px; left:3px;
    width:18px; height:18px;
    border-radius:50%;
    background: var(--bg);
    box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
    transition: transform .25s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease);
  }
  .switch input{ display:none; }
  .switch input:checked ~ .switch-track .switch-thumb{
    transform:translateX(18px);
    background: var(--brass);
    box-shadow: 0 0 8px rgba(202,160,73,0.65);
  }
  .switch span.lbl{ font-size:13px; color:var(--text-1); }
  .switch:focus-within .switch-track{ outline:2px solid var(--brass); outline-offset:2px; }

  .link{
    font-size:13px;
    color:var(--text-1);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition: color .2s var(--ease), border-color .2s var(--ease);
  }
  .link:hover{ color:var(--brass); border-color: var(--brass-soft); }
  .link:focus-visible{ outline:2px solid var(--brass); outline-offset:3px; border-radius:2px; }

  .btn-primary{
    margin-top:6px;
    width:100%;
    padding:15px 18px;
    border:none;
    border-radius:var(--radius-btn);
    background: var(--bg);
    box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
    color: var(--brass);
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:0.02em;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:9px;
    transition: box-shadow .15s var(--ease), transform .15s var(--ease), color .2s var(--ease);
  }
  .btn-primary:hover{ color:#e0b667; }
  .btn-primary:active, .btn-primary[data-loading="true"]{
    box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
    transform: translateY(1px);
  }
  .btn-primary:focus-visible{ outline:2px solid var(--brass); outline-offset:3px; }
  .btn-primary .spinner{
    width:14px; height:14px; border-radius:50%;
    border:2px solid rgba(202,160,73,0.25);
    border-top-color: var(--brass);
    display:none;
    animation: spin .7s linear infinite;
  }
  .btn-primary[data-loading="true"] .spinner{ display:inline-block; }
  .btn-primary[data-loading="true"] .btn-label::after{ content:"Verifying"; }
  .btn-primary .btn-label::after{ content:"Access vault"; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .divider{
    display:flex; align-items:center; gap:12px;
    margin:22px 0 16px;
    color:var(--text-2);
    font-size:10.5px;
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:0.1em;
  }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background: rgba(255,255,255,0.06); }

  .altauth{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .alt-btn{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:14px 10px;
    border:none; border-radius:16px;
    background: var(--bg);
    box-shadow: 6px 6px 13px var(--shadow-dark), -6px -6px 13px var(--shadow-light);
    color:var(--text-1);
    font-size:12px;
    font-family:'Manrope', sans-serif;
    font-weight:500;
    cursor:pointer;
    transition: box-shadow .15s var(--ease), color .2s var(--ease), transform .15s var(--ease);
  }
  .alt-btn:hover{ color:var(--text-0); }
  .alt-btn:active{
    box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
    transform: translateY(1px);
  }
  .alt-btn:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
  .alt-btn svg{ width:19px; height:19px; }

  .foot{
    text-align:center;
    font-size:13px;
    color:var(--text-1);
    margin-top:24px;
  }

  .trust{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:16px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--text-2);
    text-transform:uppercase;
  }
  .trust svg{ width:11px; height:11px; opacity:0.7; }

  @media (max-width:420px){
    .card{ padding:32px 22px 26px; border-radius:24px; }
  }

  @media (prefers-reduced-motion: reduce){
    .dial .needle{ animation:none; transform: translate(-50%,-100%) rotate(0deg); }
    *{ transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
  }
</style>
</head>
<body>

  <div class="card neu-out">

    <div class="dial">
      <span class="needle"></span>
      <span class="hub"></span>
    </div>

    <p class="eyebrow">Cairn · Private Vault</p>
    <h1>Unlock your vault</h1>
    <p class="sub">Enter your credentials to access your holdings.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Registered email</label>
        <input type="email" id="email" class="neu-in" autocomplete="email" required>
      </div>

      <div class="field field--pw">
        <label for="password">Passphrase</label>
        <input type="password" id="password" class="neu-in" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show passphrase" aria-pressed="false">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <div class="row-between">
        <label class="switch">
          <input type="checkbox" id="remember">
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="lbl">Stay signed in</span>
        </label>
        <a href="#" class="link">Forgot passphrase?</a>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn" data-loading="false">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label"></span>
      </button>
    </form>

    <div class="divider">OR VERIFY WITH</div>

    <div class="altauth">
      <button type="button" class="alt-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M12 2a5 5 0 0 0-5 5v2a5 5 0 0 0 10 0"/>
          <path d="M12 2a5 5 0 0 1 5 5v2"/>
          <path d="M7 11v2a5 5 0 0 0 10 0v-2"/>
          <path d="M4 11v2a8 8 0 0 0 16 0v-2"/>
          <path d="M12 16v4"/>
        </svg>
        Fingerprint
      </button>
      <button type="button" class="alt-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="15" r="4"/>
          <path d="M10.5 12.5 20 3M20 3h-4M20 3v4"/>
        </svg>
        Security key
      </button>
    </div>

    <p class="foot">New client? <a href="#" class="link">Request access</a></p>

    <div class="trust">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5l-8-3z"/></svg>
      AES-256 · Multi-factor secured
    </div>

  </div>

<script>
  // Password visibility toggle
  const pwInput = document.getElementById('password');
  const pwToggle = document.getElementById('pwToggle');
  const eyeIcon = document.getElementById('eyeIcon');
  const eyeOff = `<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.5 20.5 0 0 1-3.22 4.42M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
  const eyeOn = `<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>`;
  pwToggle.addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    pwToggle.setAttribute('aria-pressed', String(isPw));
    pwToggle.setAttribute('aria-label', isPw ? 'Hide passphrase' : 'Show passphrase');
    eyeIcon.innerHTML = isPw ? eyeOff : eyeOn;
  });

  // Demo submit state — swap for a real request
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (submitBtn.dataset.loading === 'true') return;
    submitBtn.dataset.loading = 'true';
    setTimeout(() => { submitBtn.dataset.loading = 'false'; }, 1800);
  });
</script>
</body>
</html>
