<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathom — Dive Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@1,500;0,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#040c14;
    --abyss-mid:#0a1f30;
    --teal:#3ffec0;
    --teal-dim: rgba(63,254,192,0.35);
    --panel:#071824;
    --panel-border: rgba(63,254,192,0.16);
    --field:#0c2432;
    --field-border: rgba(63,254,192,0.14);
    --text-0:#e3f5f0;
    --text-1:#7fa39a;
    --text-2:#4c6a63;
    --ease: cubic-bezier(.16,.8,.24,1);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(63,254,192,0.05), transparent 60%),
      linear-gradient(180deg, var(--abyss-mid) 0%, var(--abyss) 55%);
    font-family:'IBM Plex Sans', sans-serif;
    color: var(--text-0);
    padding:24px;
    position:relative;
    overflow:hidden;
  }

  #particles{ position:fixed; inset:0; z-index:0; display:block; }

  /* ---------- Depth gauge ruler ---------- */
  .depth-gauge{
    position:fixed; left:18px; top:8%; bottom:8%; width:34px; z-index:1;
    display:flex; flex-direction:column; justify-content:space-between;
    pointer-events:none;
  }
  .depth-gauge .mark{ display:flex; align-items:center; gap:6px; }
  .depth-gauge .mark::before{ content:""; width:9px; height:1px; background:var(--text-2); }
  .depth-gauge .mark span{
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:0.04em;
    color:var(--text-2);
  }
  @media (max-width: 780px){ .depth-gauge{ display:none; } }

  /* ---------- Panel ---------- */
  .panel{
    position:relative; z-index:2;
    width:100%; max-width:400px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    border-radius:20px;
    box-shadow: 0 0 0 1px rgba(63,254,192,0.04), 0 40px 90px -30px rgba(0,0,0,0.8), 0 0 60px -20px rgba(63,254,192,0.08);
    padding:28px 32px 28px;
  }
  .rivet{
    position:absolute; width:5px; height:5px; border-radius:50%;
    background: rgba(63,254,192,0.25);
    box-shadow: 0 0 4px rgba(63,254,192,0.3);
  }
  .rivet.tl{ top:12px; left:12px; } .rivet.tr{ top:12px; right:12px; }
  .rivet.bl{ bottom:12px; left:12px; } .rivet.br{ bottom:12px; right:12px; }

  .eyebrow{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-2);
    margin:0 0 18px;
  }

  .wordmark{
    text-align:center;
    font-family:'IBM Plex Serif', serif;
    font-style:italic;
    font-weight:600;
    font-size:26px;
    color:var(--teal);
    margin:0 0 6px;
    text-shadow: 0 0 22px rgba(63,254,192,0.35);
  }
  h1{
    text-align:center;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:18px;
    color:var(--text-0);
    margin:0 0 8px;
  }
  .sub{
    text-align:center;
    font-size:13px;
    color:var(--text-1);
    line-height:1.55;
    margin:0 0 26px;
  }

  form{ display:flex; flex-direction:column; gap:14px; }

  .field label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-2);
    margin:0 0 8px 2px;
  }
  .field{ position:relative; }
  .field input{
    width:100%;
    padding:12.5px 14px;
    background: var(--field);
    border:1px solid var(--field-border);
    border-radius:10px;
    color:var(--text-0);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    outline:none;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .field--pw input{ padding-right:64px; }
  .field input:focus{
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(63,254,192,0.13);
  }
  .pw-toggle{
    position:absolute; right:10px; bottom:11px;
    background:none; border:none; cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:0.05em;
    color:var(--text-2);
    padding:4px 6px;
    transition: color .2s var(--ease);
  }
  .pw-toggle:hover{ color:var(--teal); }
  .pw-toggle:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

  .row-between{ display:flex; align-items:center; justify-content:space-between; margin-top:1px; font-size:12.5px; }
  .remember{ display:flex; align-items:center; gap:8px; color:var(--text-1); cursor:pointer; user-select:none; }
  .remember input{
    appearance:none; -webkit-appearance:none;
    width:15px; height:15px; border-radius:4px;
    border:1px solid var(--field-border);
    background: var(--field);
    display:grid; place-content:center; cursor:pointer;
  }
  .remember input::before{
    content:""; width:8px; height:8px; border-radius:2px;
    background:var(--teal);
    transform:scale(0);
    transition: transform .15s var(--ease);
  }
  .remember input:checked::before{ transform:scale(1); }
  .remember input:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

  .link{
    color:var(--text-1); text-decoration:none;
    border-bottom:1px solid transparent;
    transition: color .2s var(--ease), border-color .2s var(--ease);
  }
  .link:hover{ color:var(--teal); border-color:var(--teal-dim); }
  .link:focus-visible{ outline:2px solid var(--teal); outline-offset:3px; }

  .btn-primary{
    position:relative;
    overflow:visible;
    margin-top:6px;
    width:100%;
    padding:13.5px 18px;
    border:none;
    border-radius:11px;
    background: var(--teal);
    color: var(--abyss);
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition: filter .2s var(--ease), transform .2s var(--ease);
  }
  .btn-primary:hover{ filter:brightness(1.08); transform:translateY(-1px); }
  .btn-primary:focus-visible{ outline:2px solid var(--text-0); outline-offset:3px; }
  .btn-primary .ripple{
    position:absolute; left:50%; top:50%; width:16px; height:16px;
    margin:-8px 0 0 -8px;
    border-radius:50%;
    border:2px solid var(--abyss);
    opacity:0;
    pointer-events:none;
  }
  .btn-primary[data-loading="true"] .ripple{ animation: ripple 1.1s ease-out infinite; }
  .btn-primary[data-loading="true"]{ pointer-events:none; }
  @keyframes ripple{ 0%{ transform:scale(0.4); opacity:0.7; } 100%{ transform:scale(3.4); opacity:0; } }
  .btn-primary[data-loading="true"] .btn-label::after{ content:"Syncing dive log…"; }
  .btn-primary[data-loading="false"] .btn-label::after{ content:"Sign in"; }

  .divider{
    display:flex; align-items:center; gap:12px;
    margin:22px 0 16px;
    color:var(--text-2);
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
  }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--field-border); }

  .altauth{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .alt-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 10px;
    border:1px solid var(--field-border);
    border-radius:10px;
    background: var(--field);
    color:var(--text-1);
    font-size:12.5px;
    font-weight:500;
    cursor:pointer;
    transition: border-color .2s var(--ease), color .2s var(--ease);
  }
  .alt-btn:hover{ border-color:var(--teal-dim); color:var(--text-0); }
  .alt-btn:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .alt-btn svg{ width:14px; height:14px; flex-shrink:0; }

  .foot{ text-align:center; font-size:13px; color:var(--text-1); margin-top:22px; }
  .trust{ text-align:center; font-size:11px; color:var(--text-2); margin-top:14px; }

  @media (max-width:440px){
    .panel{ padding:24px 22px 24px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
  }
</style>
</head>
<body>

  <canvas id="particles" aria-hidden="true"></canvas>

  <div class="depth-gauge" aria-hidden="true">
    <div class="mark"><span>0M</span></div>
    <div class="mark"><span>140M</span></div>
    <div class="mark"><span>280M</span></div>
    <div class="mark"><span>420M</span></div>
    <div class="mark"><span>560M</span></div>
    <div class="mark"><span>700M</span></div>
  </div>

  <div class="panel">
    <span class="rivet tl"></span><span class="rivet tr"></span>
    <span class="rivet bl"></span><span class="rivet br"></span>

    <p class="eyebrow">R/V Halcyon · Dive Console</p>
    <p class="wordmark">Fathom</p>
    <h1>Access the dive console</h1>
    <p class="sub">Sign in to review sensor data from your latest expedition.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>

      <div class="field field--pw">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" id="pwToggle" aria-pressed="false">SHOW</button>
      </div>

      <div class="row-between">
        <label class="remember">
          <input type="checkbox" id="remember">
          Remember this console
        </label>
        <a href="#" class="link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn" data-loading="false">
        <span class="btn-label"></span>
        <span class="ripple"></span>
      </button>
    </form>

    <div class="divider">Or continue with</div>

    <div class="altauth">
      <button type="button" class="alt-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
        ORCID
      </button>
      <button type="button" class="alt-btn">
        <svg viewBox="0 0 24 24"><path fill="#8fb8ac" d="M12 10.2v3.9h5.5c-.24 1.4-1.7 4.1-5.5 4.1-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3.4 14.7 2.4 12 2.4 6.9 2.4 2.7 6.6 2.7 11.7S6.9 21 12 21c6.9 0 9.3-4.8 9.3-7.3 0-.5 0-.9-.1-1.3H12z"/></svg>
        Google
      </button>
    </div>

    <p class="foot">New to Fathom? <a href="#" class="link">Request expedition access</a></p>
    <p class="trust">Sensor data encrypted at rest and in transit.</p>
  </div>

<script>
  // Password visibility toggle
  const pwInput = document.getElementById('password');
  const pwToggle = document.getElementById('pwToggle');
  pwToggle.addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    pwToggle.textContent = isPw ? 'HIDE' : 'SHOW';
    pwToggle.setAttribute('aria-pressed', String(isPw));
  });

  // Demo submit state
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (submitBtn.dataset.loading === 'true') return;
    submitBtn.dataset.loading = 'true';
    setTimeout(() => { submitBtn.dataset.loading = 'false'; }, 1900);
  });

  // Bioluminescent plankton field — glows brighter near the cursor, no connecting lines
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR, motes = [];
  let mouse = { x:-9999, y:-9999 };

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const count = Math.round((W*H) / 9000);
    motes = Array.from({length: count}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.6 + 0.9,
      vy: -(Math.random()*0.12 + 0.03),
      sway: Math.random()*Math.PI*2,
      swaySpeed: Math.random()*0.006 + 0.003,
      phase: Math.random()*Math.PI*2,
      speed: Math.random()*0.6 + 0.4
    }));
  }
  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
  resize();

  const GLOW_RADIUS = 170;

  function draw(t){
    ctx.clearRect(0,0,W,H);
    for (const m of motes){
      if (!reduceMotion){
        m.y += m.vy;
        m.sway += m.swaySpeed;
        m.x += Math.sin(m.sway) * 0.12;
        if (m.y < -10){ m.y = H + 10; m.x = Math.random()*W; }
      }
      const breathe = 0.35 + 0.25 * Math.sin(t * 0.0012 * m.speed + m.phase);
      const dx = m.x - mouse.x, dy = m.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const boost = dist < GLOW_RADIUS ? (1 - dist/GLOW_RADIUS) : 0;
      const alpha = Math.min(1, breathe + boost * 0.85);
      const rad = m.r * (1 + boost * 1.8);

      const grad = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, rad * 4);
      grad.addColorStop(0, `rgba(63,254,192,${alpha})`);
      grad.addColorStop(1, 'rgba(63,254,192,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(m.x, m.y, rad * 4, 0, Math.PI*2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(m.x, m.y, rad, 0, Math.PI*2);
      ctx.fillStyle = `rgba(220,255,245,${Math.min(1, alpha + 0.2)})`;
      ctx.fill();
    }
    if (!reduceMotion) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
