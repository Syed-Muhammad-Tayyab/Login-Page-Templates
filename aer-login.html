<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aer — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ECEAE1;
    --bg-panel: #E1DDCF;
    --card: #F4F2EA;
    --ink: #232420;
    --muted: #85806F;
    --muted-2: #B9B3A0;
    --line: rgba(35,36,32,0.12);
    --line-soft: rgba(35,36,32,0.07);
    --green: #3E4F3C;
    --gold: #B99A5B;
    --wine: #8B5A62;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    font-family:'Inter', sans-serif;
    color: var(--ink);
  }

  body{ display:flex; min-height:100vh; }

  a{ color:inherit; }

  /* ---------- LEFT: ATELIER STAGE ---------- */

  .stage{
    position:relative;
    flex: 1 1 55%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding: clamp(28px, 4vw, 64px);
    min-height: 480px;
    overflow:hidden;
    background: var(--bg-panel);
  }

  canvas#particles{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
  }

  .brand-row{
    position:relative; z-index:3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }

  .brand{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 25px;
    letter-spacing: 0.02em;
  }

  .eyebrow{
    font-family:'Inter', sans-serif;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .mark-stage{
    position:relative;
    z-index:2;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height: 220px;
  }

  .mark-stage svg{
    width: clamp(110px, 14vw, 160px);
    height: auto;
    opacity: 0.9;
  }

  .stage-copy{
    position:relative; z-index:3;
    max-width: 30ch;
  }

  .stage-copy h2{
    font-family:'Cormorant Garamond', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(28px, 3.4vw, 40px);
    line-height: 1.2;
    margin: 0 0 14px 0;
    color: var(--ink);
  }

  .stage-copy p{
    margin:0;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stage-foot{
    position:relative; z-index:3;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top: 1px solid var(--line);
    padding-top: 18px;
    margin-top: 26px;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted-2);
  }

  /* ---------- RIGHT: FORM PANEL ---------- */

  .form-panel{
    flex: 1 1 45%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: clamp(24px, 5vw, 60px);
    background: var(--bg);
  }

  .form-card{
    width:100%;
    max-width: 380px;
  }

  .form-head{ margin-bottom: 36px; }

  .form-head .eyebrow{ display:block; margin-bottom: 14px; color: var(--muted); }

  .form-head h1{
    font-family:'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 40px;
    margin: 0 0 10px 0;
    letter-spacing: 0.005em;
  }

  .form-head p{
    margin:0;
    font-size: 14px;
    color: var(--muted);
    line-height:1.6;
  }

  .form-head p a{
    color: var(--green);
    text-decoration:none;
    border-bottom: 1px solid rgba(62,79,60,0.35);
  }

  form{ display:flex; flex-direction:column; gap: 22px; }

  .field{ display:flex; flex-direction:column; gap: 8px; }

  .field-label-row{ display:flex; justify-content:space-between; align-items:baseline; }

  label{
    font-family:'Inter', sans-serif;
    font-weight: 500;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .forgot{
    font-family:'Inter', sans-serif;
    font-size: 11.5px;
    color: var(--muted);
    text-decoration:none;
    border-bottom: 1px solid transparent;
    transition: color 200ms ease, border-color 200ms ease;
  }
  .forgot:hover{ color: var(--green); border-color: rgba(62,79,60,0.4); }

  .input-row{
    display:flex;
    align-items:center;
    border-bottom: 1.5px solid var(--line);
    transition: border-color 220ms ease;
  }

  .input-row:focus-within{ border-color: var(--green); }

  input[type="email"], input[type="password"], input[type="text"]{
    width:100%;
    border:none;
    background:transparent;
    outline:none;
    font-family:'Inter', sans-serif;
    font-size: 16px;
    color: var(--ink);
    padding: 10px 2px 12px 2px;
  }

  input::placeholder{ color: var(--muted-2); }

  .toggle-vis{
    background:none; border:none; cursor:pointer;
    padding: 6px;
    color: var(--muted);
    font-family:'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: color 180ms ease;
    flex-shrink:0;
  }
  .toggle-vis:hover{ color: var(--green); }

  button.submit{
    margin-top: 6px;
    width:100%;
    padding: 15px 20px;
    border-radius: 2px;
    background: var(--green);
    color: var(--card);
    border: 1px solid var(--green);
    font-family:'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    transition: background 220ms ease, color 220ms ease;
  }
  button.submit:hover{ background: var(--gold); border-color: var(--gold); color: var(--ink); }
  button.submit .arrow{ transition: transform 220ms ease; }
  button.submit:hover .arrow{ transform: translateX(4px); }

  .divider{ display:flex; align-items:center; gap: 14px; margin: 4px 0 2px 0; }
  .divider .line{ flex:1; height:1px; background: var(--line); }
  .divider span{
    font-family:'Inter', sans-serif;
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }

  .sso-row{ display:flex; gap: 12px; }

  .sso-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap: 9px;
    padding: 12px 10px;
    background: transparent;
    border: 1.5px solid var(--line);
    font-family:'Inter', sans-serif;
    font-size: 13.5px; font-weight: 500;
    color: var(--ink);
    cursor:pointer;
    transition: border-color 200ms ease, background 200ms ease;
  }
  .sso-btn:hover{ border-color: var(--ink); background: var(--card); }
  .sso-btn svg{ width:16px; height:16px; flex-shrink:0; }

  .footnote{
    margin-top: 30px;
    font-size: 12.5px;
    color: var(--muted);
    text-align:center;
  }
  .footnote a{ color: var(--muted); text-decoration:none; border-bottom: 1px solid var(--muted-2); }

  button:focus-visible, a:focus-visible, input:focus-visible{
    outline: 2px solid var(--green);
    outline-offset: 3px;
  }

  @media (max-width: 900px){
    body{ flex-direction:column; }
    .stage{ flex:none; min-height: 340px; }
    .stage-copy{ display:none; }
    .form-panel{ flex:none; padding-top: 36px; padding-bottom: 56px; }
  }

  @media (prefers-reduced-motion: reduce){
    canvas#particles{ opacity: 0.7; }
  }
</style>
</head>
<body>

  <section class="stage" id="stageArea">
    <canvas id="particles"></canvas>

    <div class="brand-row">
      <div class="brand">Aer</div>
      <div class="eyebrow">Fragrance Atelier</div>
    </div>

    <div class="mark-stage">
      <svg viewBox="0 0 100 140" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="8" width="14" height="10" rx="2" stroke="#3E4F3C" stroke-width="1.2"/>
        <path d="M33 18 L33 28 Q33 32 29 34 Q22 38 22 50 L22 122 Q22 132 32 132 L68 132 Q78 132 78 122 L78 50 Q78 38 71 34 Q67 32 67 28 L67 18"
          stroke="#3E4F3C" stroke-width="1.2" stroke-linejoin="round"/>
        <line x1="22" y1="58" x2="78" y2="58" stroke="#3E4F3C" stroke-width="0.8" opacity="0.5"/>
      </svg>
    </div>

    <div class="stage-copy">
      <h2>Every particle carries a memory.</h2>
      <p>Est. Grasse, 2014</p>
    </div>

    <div class="stage-foot">
      <span>Small batch</span>
      <span>Hand poured</span>
      <span>No. 04 collection</span>
    </div>
  </section>

  <section class="form-panel">
    <div class="form-card">
      <div class="form-head">
        <span class="eyebrow">Member sign-in</span>
        <h1>Welcome back</h1>
        <p>New to Aer? <a href="#">Create an account</a></p>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="email">Email</label>
          <div class="input-row">
            <input type="email" id="email" name="email" placeholder="you@aer.co" required>
          </div>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label for="pass">Password</label>
            <a href="#" class="forgot">Forgot?</a>
          </div>
          <div class="input-row">
            <input type="password" id="pass" name="pass" placeholder="••••••••••" required>
            <button type="button" class="toggle-vis" id="toggleVis">Show</button>
          </div>
        </div>

        <button type="submit" class="submit">
          <span>Sign in</span>
          <span class="arrow">→</span>
        </button>

        <div class="divider"><div class="line"></div><span>or continue with</span><div class="line"></div></div>

        <div class="sso-row">
          <button type="button" class="sso-btn">
            <svg viewBox="0 0 24 24" fill="none"><path d="M22 12.2c0-.75-.07-1.47-.19-2.16H12v4.1h5.6a4.8 4.8 0 0 1-2.08 3.15v2.6h3.37c1.97-1.82 3.11-4.5 3.11-7.69Z" fill="#4285F4"/><path d="M12 22c2.8 0 5.15-.93 6.87-2.51l-3.37-2.6c-.94.63-2.14 1-3.5 1-2.69 0-4.97-1.82-5.78-4.26H2.75v2.68A10 10 0 0 0 12 22Z" fill="#34A853"/><path d="M6.22 13.63A6.02 6.02 0 0 1 5.9 12c0-.57.1-1.12.32-1.63V7.69H2.75A10 10 0 0 0 1.7 12c0 1.61.39 3.14 1.05 4.31l3.47-2.68Z" fill="#FBBC05"/><path d="M12 5.98c1.52 0 2.88.52 3.95 1.55l2.96-2.96C17.14 2.86 14.8 1.9 12 1.9a10 10 0 0 0-9.25 5.79l3.47 2.68C7.03 7.8 9.31 5.98 12 5.98Z" fill="#EA4335"/></svg>
            Google
          </button>
          <button type="button" class="sso-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.36 1.43c.1 1-.28 2.03-.9 2.79-.63.77-1.65 1.38-2.66 1.3-.12-.98.36-2.02.95-2.7.66-.77 1.77-1.36 2.61-1.39ZM20.4 17.2c-.44 1.02-.65 1.48-1.22 2.39-.79 1.26-1.9 2.82-3.28 2.84-1.22.02-1.54-.8-3.2-.79-1.66.01-2 .8-3.23.78-1.38-.02-2.43-1.44-3.22-2.7-2.22-3.52-2.45-7.65-1.08-9.85.97-1.56 2.5-2.47 3.94-2.47 1.47 0 2.39.81 3.6.81 1.18 0 1.9-.81 3.6-.81 1.29 0 2.66.7 3.63 1.92-3.19 1.75-2.67 6.31.46 7.88Z"/></svg>
            Apple
          </button>
        </div>
      </form>

      <p class="footnote">By continuing you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
    </div>
  </section>

<script>
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const stageArea = document.getElementById('stageArea');

  const HUES = [
    { r: 185, g: 154, b: 91 },   // gold
    { r: 62,  g: 79,  b: 60 },   // green
    { r: 139, g: 90,  b: 98 }    // wine
  ];

  let particles = [];
  let pointer = { x: -9999, y: -9999, active: false };
  let w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    w = stageArea.clientWidth;
    h = stageArea.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawn(){
    const hue = HUES[Math.floor(Math.random() * HUES.length)];
    return {
      x: Math.random() * w,
      y: h + 20 + Math.random() * 60,
      r: 6 + Math.random() * 16,
      vy: -(0.18 + Math.random() * 0.35),
      vx: (Math.random() - 0.5) * 0.12,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.004 + Math.random() * 0.006,
      alpha: 0,
      alphaTarget: 0.10 + Math.random() * 0.16,
      hue
    };
  }

  const COUNT = 46;

  function init(){
    resize();
    particles = Array.from({ length: COUNT }, () => {
      const p = spawn();
      p.y = Math.random() * h;
      p.alpha = p.alphaTarget;
      return p;
    });
  }

  function step(){
    ctx.clearRect(0, 0, w, h);

    particles.forEach((p) => {
      p.sway += p.swaySpeed;
      p.x += p.vx + Math.sin(p.sway) * 0.25;
      p.y += p.vy;

      if (pointer.active){
        const dx = p.x - pointer.x;
        const dy = p.y - pointer.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 90){
          const force = (90 - dist) / 90;
          p.x += (dx / (dist || 1)) * force * 1.6;
          p.y += (dy / (dist || 1)) * force * 1.6;
        }
      }

      if (p.alpha < p.alphaTarget) p.alpha += 0.003;

      if (p.y < -40){
        Object.assign(p, spawn());
      }

      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      grad.addColorStop(0, `rgba(${p.hue.r},${p.hue.g},${p.hue.b},${p.alpha})`);
      grad.addColorStop(1, `rgba(${p.hue.r},${p.hue.g},${p.hue.b},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });

    requestAnimationFrame(step);
  }

  init();
  window.addEventListener('resize', resize);

  stageArea.addEventListener('mousemove', (e) => {
    const rect = stageArea.getBoundingClientRect();
    pointer.x = e.clientX - rect.left;
    pointer.y = e.clientY - rect.top;
    pointer.active = true;
  });
  stageArea.addEventListener('mouseleave', () => { pointer.active = false; });

  if (!prefersReduced){
    requestAnimationFrame(step);
  } else {
    step(); // draw a single static frame, no rAF loop
  }

  // password visibility
  const pwInput = document.getElementById('pass');
  const toggleBtn = document.getElementById('toggleVis');
  toggleBtn.addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    toggleBtn.textContent = isPw ? 'Hide' : 'Show';
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => e.preventDefault());
</script>

</body>
</html>
