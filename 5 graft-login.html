<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRAFT — Authenticate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #050708;
    --void-2: #0A0D0F;
    --panel: #0D1113;
    --line: rgba(220,237,234,0.08);
    --line-strong: rgba(220,237,234,0.16);
    --text: #DCEDEA;
    --muted: #5E6E6C;
    --muted-2: #3E4A48;
    --green: #39FF88;
    --green-dim: #1F8F52;
    --magenta: #FF2FA0;
    --amber: #FFB84D;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: var(--void);
    font-family:'Inter', sans-serif;
    color: var(--text);
  }

  body{
    display:flex;
    min-height:100vh;
    position:relative;
  }

  a{ color:inherit; }

  /* ambient grid + vignette across whole page */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 44px 44px;
    opacity:0.5;
    pointer-events:none;
    z-index:0;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    background: radial-gradient(120% 90% at 50% 15%, transparent 30%, var(--void) 88%);
    pointer-events:none;
    z-index:0;
  }

  /* ---------- LEFT: MONITOR PANEL ---------- */

  .monitor-panel{
    position:relative;
    z-index:1;
    flex: 1 1 54%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding: clamp(28px, 4vw, 60px);
    border-right: 1px solid var(--line-strong);
    min-height: 460px;
    background: linear-gradient(180deg, rgba(57,255,136,0.03), transparent 40%);
  }

  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }

  .brand{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 20px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    position: relative;
  }

  .brand::before{ content: "GRAFT"; }

  .brand.glitch::before{
    animation: glitch 900ms steps(2, end) 1;
  }

  @keyframes glitch{
    0%{ text-shadow: 0 0 0 transparent; transform: translate(0,0); }
    18%{ text-shadow: -2px 0 var(--magenta), 2px 0 var(--green); transform: translate(-1px,0); }
    36%{ text-shadow: 2px 0 var(--magenta), -2px 0 var(--green); transform: translate(1px,0); }
    54%{ text-shadow: -1px 0 var(--magenta), 1px 0 var(--green); transform: translate(0,0); }
    100%{ text-shadow: 0 0 0 transparent; transform: translate(0,0); }
  }

  .status-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--green);
    display:flex;
    align-items:center;
    gap:7px;
  }

  .status-tag .pip{
    width:6px; height:6px; border-radius:50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: blink 1.8s ease-in-out infinite;
  }

  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

  .monitor-stage{
    margin: 36px 0;
    position:relative;
  }

  .monitor-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .wave-frame{
    position:relative;
    height: clamp(140px, 22vw, 220px);
    overflow:hidden;
    border-top: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line-strong);
  }

  .wave-track{
    position:absolute;
    top:0; left:0;
    height:100%;
    width:200%;
    display:flex;
    animation: scrollWave 7s linear infinite;
  }

  .wave-track svg{ height:100%; width:50%; flex-shrink:0; display:block; }

  @keyframes scrollWave{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  .headline{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size: clamp(30px, 4vw, 46px);
    letter-spacing: -0.01em;
    line-height: 1.05;
    margin: 26px 0 0 0;
    max-width: 12ch;
  }

  .headline .hl{ color: var(--green); }

  .vitals-row{
    display:flex;
    gap: 28px;
    flex-wrap: wrap;
    border-top: 1px solid var(--line-strong);
    padding-top: 20px;
  }

  .vital{
    font-family:'IBM Plex Mono', monospace;
  }

  .vital .v-label{
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .vital .v-value{
    font-size: 18px;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .vital .v-value.accent{ color: var(--green); }

  /* ---------- RIGHT: FORM PANEL ---------- */

  .form-panel{
    position:relative;
    z-index:1;
    flex: 1 1 46%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: clamp(28px, 5vw, 60px);
  }

  .form-wrap{ width:100%; max-width: 380px; }

  .form-head{ margin-bottom: 38px; }

  .form-head .status-tag{ color: var(--muted); margin-bottom: 16px; }
  .form-head .status-tag .pip{ background: var(--muted); box-shadow:none; animation:none; }

  .form-head h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 34px;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    margin: 0 0 12px 0;
  }

  .form-head p{
    margin:0;
    font-size: 14px;
    color: var(--muted);
    line-height:1.6;
  }

  .form-head p a{
    color: var(--green);
    text-decoration:none;
    border-bottom: 1px solid var(--green-dim);
  }

  form{ display:flex; flex-direction:column; gap: 22px; }

  .field{ display:flex; flex-direction:column; gap: 8px; }

  .field-label-row{ display:flex; justify-content:space-between; align-items:baseline; }

  label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .reset-link{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    color: var(--muted);
    text-decoration:none;
    border-bottom: 1px solid transparent;
    transition: color 180ms ease, border-color 180ms ease;
  }
  .reset-link:hover{ color: var(--green); border-color: var(--green-dim); }

  .input-row{
    position:relative;
    display:flex;
    align-items:center;
    background: var(--panel);
    border: 1px solid var(--line-strong);
    transition: border-color 220ms ease, box-shadow 220ms ease;
  }

  .input-row:focus-within{
    border-color: var(--green);
    box-shadow: 0 0 0 1px var(--green), 0 0 16px rgba(57,255,136,0.25);
  }

  input[type="text"], input[type="password"]{
    width:100%;
    border:none;
    background:transparent;
    outline:none;
    font-family:'IBM Plex Mono', monospace;
    font-size: 15px;
    color: var(--text);
    padding: 13px 12px;
    letter-spacing:0.02em;
  }

  input::placeholder{ color: var(--muted-2); }

  .toggle-vis{
    background:none; border:none; cursor:pointer;
    padding: 8px 12px;
    color: var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 180ms ease;
    flex-shrink:0;
    border-left: 1px solid var(--line-strong);
  }
  .toggle-vis:hover{ color: var(--green); }

  .signal-meter{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted-2);
    height: 14px;
    letter-spacing: 0.03em;
  }
  .signal-meter.on{ color: var(--green); }

  button.submit{
    margin-top: 4px;
    width:100%;
    padding: 15px 18px;
    background: transparent;
    color: var(--green);
    border: 1px solid var(--green);
    font-family:'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    position:relative;
    overflow:hidden;
    transition: color 200ms ease;
  }

  button.submit::before{
    content:"";
    position:absolute; inset:0;
    background: var(--green);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 260ms ease;
    z-index:0;
  }

  button.submit span{ position:relative; z-index:1; }

  button.submit:hover{ color: var(--void); }
  button.submit:hover::before{ transform: scaleX(1); }

  button.submit .arrow{ font-family:'IBM Plex Mono', monospace; transition: transform 220ms ease; }
  button.submit:hover .arrow{ transform: translateX(4px); }

  .divider{ display:flex; align-items:center; gap: 14px; margin: 4px 0 2px 0; }
  .divider .line{ flex:1; height:1px; background: var(--line-strong); }
  .divider span{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }

  .sso-row{ display:flex; gap: 12px; }

  .sso-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap: 9px;
    padding: 12px 10px;
    background: var(--panel);
    border: 1px solid var(--line-strong);
    font-family:'Inter', sans-serif;
    font-size: 13px; font-weight: 500;
    color: var(--text);
    cursor:pointer;
    transition: border-color 200ms ease;
  }
  .sso-btn:hover{ border-color: var(--muted); }
  .sso-btn svg{ width:15px; height:15px; flex-shrink:0; }

  .footnote{
    margin-top: 30px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--muted-2);
    text-align:center;
  }
  .footnote a{ color: var(--muted); text-decoration:none; border-bottom: 1px solid var(--muted-2); }

  button:focus-visible, a:focus-visible, input:focus-visible{
    outline: 1px solid var(--green);
    outline-offset: 3px;
  }

  @media (max-width: 860px){
    body{ flex-direction:column; }
    .monitor-panel{ flex:none; border-right:none; border-bottom: 1px solid var(--line-strong); min-height:auto; }
    .headline{ font-size: 28px; }
    .vitals-row{ gap: 20px; }
    .form-panel{ flex:none; padding-top:40px; padding-bottom:56px; }
  }

  @media (prefers-reduced-motion: reduce){
    .wave-track{ animation: none; }
    .status-tag .pip{ animation:none; }
    .brand.glitch::before{ animation:none; }
  }
</style>
</head>
<body>

  <section class="monitor-panel">
    <div class="brand-row">
      <div class="brand glitch"></div>
      <div class="status-tag"><span class="pip"></span>Awaiting credentials</div>
    </div>

    <div class="monitor-stage">
      <div class="monitor-label">Live signal — access node 04</div>
      <div class="wave-frame">
        <div class="wave-track">
          <svg viewBox="0 0 600 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3.2" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <path d="M0,100 L60,100 L80,100 L95,40 L110,160 L125,100 L160,100 L300,100 L320,100 L335,50 L350,150 L365,100 L400,100 L600,100"
              fill="none" stroke="#39FF88" stroke-width="2.5" filter="url(#glow1)"/>
          </svg>
          <svg viewBox="0 0 600 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,100 L60,100 L80,100 L95,40 L110,160 L125,100 L160,100 L300,100 L320,100 L335,50 L350,150 L365,100 L400,100 L600,100"
              fill="none" stroke="#39FF88" stroke-width="2.5" filter="url(#glow1)"/>
          </svg>
        </div>
      </div>
    </div>

    <h2 class="headline">Where flesh<br>meets <span class="hl">firmware.</span></h2>

    <div class="vitals-row">
      <div class="vital">
        <div class="v-label">Pulse</div>
        <div class="v-value accent" id="vPulse">72 bpm</div>
      </div>
      <div class="vital">
        <div class="v-label">Signal</div>
        <div class="v-value" id="vSignal">locked</div>
      </div>
      <div class="vital">
        <div class="v-label">Latency</div>
        <div class="v-value" id="vLatency">14 ms</div>
      </div>
    </div>
  </section>

  <section class="form-panel">
    <div class="form-wrap">
      <div class="form-head">
        <div class="status-tag"><span class="pip"></span>Patient portal</div>
        <h1>Authenticate</h1>
        <p>Returning patients only. <a href="#">Request enrollment</a></p>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="handle">Handle / ID</label>
          <div class="input-row">
            <input type="text" id="handle" name="handle" placeholder="GX-04891" required>
          </div>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label for="pass">Passphrase</label>
            <a href="#" class="reset-link">Reset</a>
          </div>
          <div class="input-row">
            <input type="password" id="pass" name="pass" placeholder="••••••••••••" required>
            <button type="button" class="toggle-vis" id="toggleVis">Show</button>
          </div>
          <div class="signal-meter" id="signalMeter"></div>
        </div>

        <button type="submit" class="submit">
          <span>Authenticate</span>
          <span class="arrow">→</span>
        </button>

        <div class="divider"><div class="line"></div><span>or continue with</span><div class="line"></div></div>

        <div class="sso-row">
          <button type="button" class="sso-btn">
            <svg viewBox="0 0 24 24" fill="none"><path d="M22 12.2c0-.75-.07-1.47-.19-2.16H12v4.1h5.6a4.8 4.8 0 0 1-2.08 3.15v2.6h3.37c1.97-1.82 3.11-4.5 3.11-7.69Z" fill="#4285F4"/><path d="M12 22c2.8 0 5.15-.93 6.87-2.51l-3.37-2.6c-.94.63-2.14 1-3.5 1-2.69 0-4.97-1.82-5.78-4.26H2.75v2.68A10 10 0 0 0 12 22Z" fill="#34A853"/><path d="M6.22 13.63A6.02 6.02 0 0 1 5.9 12c0-.57.1-1.12.32-1.63V7.69H2.75A10 10 0 0 0 1.7 12c0 1.61.39 3.14 1.05 4.31l3.47-2.68Z" fill="#FBBC05"/><path d="M12 5.98c1.52 0 2.88.52 3.95 1.55l2.96-2.96C17.14 2.86 14.8 1.9 12 1.9a10 10 0 0 0-9.25 5.79l3.47 2.68C7.03 7.8 9.31 5.98 12 5.98Z" fill="#EA4335"/></svg>
            Google
          </button>
          <button type="button" class="sso-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.79-.25.79-.55v-1.94c-3.2.7-3.87-1.54-3.87-1.54-.53-1.33-1.29-1.69-1.29-1.69-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.29 1.19-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.8 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.07.78 2.16v3.2c0 .3.21.66.8.55C20.21 21.38 23.5 17.07 23.5 12 23.5 5.65 18.35.5 12 .5Z"/></svg>
            GitHub
          </button>
        </div>
      </form>

      <p class="footnote">ENCRYPTED CHANNEL · <a href="#">TERMS</a> · <a href="#">PRIVACY</a></p>
    </div>
  </section>

<script>
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // one-time glitch reveal on the brand wordmark
  const brandEl = document.querySelector('.brand');
  if (!prefersReduced){
    requestAnimationFrame(() => brandEl.classList.add('glitch'));
  }

  // ambient vitals jitter, thematically tied to the clinic concept
  const vPulse = document.getElementById('vPulse');
  const vLatency = document.getElementById('vLatency');

  if (!prefersReduced){
    setInterval(() => {
      const bpm = 70 + Math.floor(Math.random() * 5);
      const lat = 11 + Math.floor(Math.random() * 8);
      vPulse.textContent = `${bpm} bpm`;
      vLatency.textContent = `${lat} ms`;
    }, 2200);
  }

  // password visibility toggle
  const pwInput = document.getElementById('pass');
  const toggleBtn = document.getElementById('toggleVis');
  toggleBtn.addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    toggleBtn.textContent = isPw ? 'Hide' : 'Show';
  });

  // live signal meter as passphrase is entered
  const signalMeter = document.getElementById('signalMeter');
  pwInput.addEventListener('input', () => {
    const len = pwInput.value.length;
    if (len === 0){ signalMeter.textContent = ''; signalMeter.classList.remove('on'); return; }
    signalMeter.textContent = len < 6 ? `signal weak · ${len} chars` : `signal locked · ${len} chars`;
    signalMeter.classList.toggle('on', len >= 6);
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => e.preventDefault());
</script>

</body>
</html>
